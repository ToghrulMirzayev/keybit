<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KeyBit — Coming soon</title>
<meta name="description" content="KeyBit is coming soon."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#7aa66c"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"/>
<meta name="referrer" content="no-referrer"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1f1a'/%3E%3Cpolyline points='11,10 18,16 11,22' fill='none' stroke='%23faf6ee' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='22' r='2' fill='%237aa66c'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="assets/css/fonts.css"/>
<!--
  Standalone "Coming soon" page. This is what visitors get while COMING_SOON_BANNER is not "false"
  (see scripts/build.js). It is self-contained on purpose: no scripts or texts of the real site,
  no cookies, no storage, no third-party requests. The language follows the visitor's browser.
-->
<style>
:root{--bg:#f1ebe0;--card:#faf6ee;--accent:#7aa66c;--accent2:#5f8954;--text:#1c1f1a;--text2:#4d5249;--border-strong:rgba(28,31,26,0.18);--shadow-lg:0 4px 8px rgba(28,31,26,0.06),0 16px 40px rgba(28,31,26,0.08);--grid:rgba(28,31,26,0.05);--glow:rgba(122,166,108,0.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f0c;--card:#141712;--accent:#8fc47c;--accent2:#a4d692;--text:#ebe9e1;--text2:#a8a89e;--border-strong:rgba(235,233,225,0.15);--shadow-lg:0 4px 8px rgba(0,0,0,0.4),0 16px 40px rgba(0,0,0,0.3);--grid:rgba(235,233,225,0.04);--glow:rgba(143,196,124,0.12)}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 50% at 80% 10%,var(--glow),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,72px 72px,72px 72px}
.cs-card{background:var(--card);border:1px solid var(--border-strong);border-radius:18px;padding:3.5rem 3rem;max-width:480px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:up .7s cubic-bezier(.3,.7,.4,1) .1s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cs-logo{display:inline-flex;align-items:center;gap:11px;margin-bottom:2.2rem;font-weight:700;font-size:1.5rem;letter-spacing:-.04em}
.logo-mark{width:36px;height:36px;display:inline-flex}
.logo-mark svg{width:100%;height:100%;display:block}
.lm-badge{fill:var(--text)}
.lm-chevron{stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lm-dot{fill:var(--accent)}
.cs-title{font-family:'Fraunces',serif;font-size:clamp(2.4rem,5vw,3.4rem);font-weight:400;letter-spacing:-.03em;line-height:1.05;margin-bottom:1.2rem}
.cs-title em{font-style:italic;color:var(--accent2)}
.cs-desc{font-size:.98rem;color:var(--text2);line-height:1.7;max-width:380px;margin:0 auto}
[data-l]{display:none}
html[lang="en"] [data-l="en"],html[lang="ru"] [data-l="ru"],html[lang="az"] [data-l="az"]{display:block}
@media (max-width:480px){.cs-card{padding:2.6rem 1.5rem}}
@media (prefers-reduced-motion:reduce){.cs-card{animation:none}}
</style>
</head>
<body>
<main class="cs-card">
  <div class="cs-logo">
    <span class="logo-mark">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect class="lm-badge" width="32" height="32" rx="7"/>
        <polyline class="lm-chevron" points="11,10 18,16 11,22"/>
        <circle class="lm-dot" cx="22.5" cy="22" r="2"/>
      </svg>
    </span>
    <span>keybit</span>
  </div>
  <h1 class="cs-title" data-l="en">Coming <em>soon.</em></h1>
  <h1 class="cs-title" data-l="ru">Скоро <em>запуск.</em></h1>
  <h1 class="cs-title" data-l="az">Tezliklə <em>açılır.</em></h1>
  <p class="cs-desc" data-l="en">We're putting the finishing touches on something we're proud of. Check back shortly.</p>
  <p class="cs-desc" data-l="ru">Мы наносим финальные штрихи на то, чем гордимся. Загляните чуть позже.</p>
  <p class="cs-desc" data-l="az">Qürür duyduğumuz bir şeyə son toxunuşları edirik. Bir az sonra qayıdın.</p>
</main>
<script>
(function () {
  var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  for (var i = 0; i < list.length; i++) {
    var l = String(list[i]).slice(0, 2).toLowerCase();
    if (l === 'ru' || l === 'az' || l === 'en') { document.documentElement.setAttribute('lang', l); break; }
  }
})();
</script>
</body>
</html>
